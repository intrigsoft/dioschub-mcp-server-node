name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Build before test: the northwind e2e imports the package by name
      # (@dioschub/mcp-server), which resolves to dist via the exports map.
      - run: npm run build
      - run: npm test
