name: Publish

# What is on the `production` branch is what is published. Bump the version on
# `main`, merge to `production`, and CI publishes it. Re-pushing production
# without a version bump is a safe no-op (the guard below skips the publish).
on:
  push:
    branches: [production]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC identity for npm Trusted Publishing (no stored token)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          scope: '@dioschub'
          cache: npm
      # Trusted Publishing (OIDC) needs npm >= 11.5.1; node 20 ships 10.x.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Skip the publish if this exact version is already on npm, so a push to
      # production without a version bump does not fail on "cannot republish".
      - name: Is this version already published?
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "already $NAME@$VERSION is on npm — skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      # No NODE_AUTH_TOKEN: npm >= 11.5.1 exchanges the GitHub OIDC token for a
      # short-lived publish credential via the package's Trusted Publisher config.
      # publishConfig.access=public keeps the scoped package public.
      - name: Publish to npm (Trusted Publishing / OIDC)
        if: steps.check.outputs.skip == 'false'
        run: npm publish
