name: Publish

# A version bump merged to `main` is published. Every push to `main` runs this;
# the guard below skips the publish when that exact version is already on npm,
# so ordinary merges (no bump) are a no-op. `production` still works the same
# way for anyone who prefers to release from it.
on:
  push:
    branches: [main, production]
  workflow_dispatch:

# Two pushes in a row never publish the same version twice in parallel.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC identity for npm Trusted Publishing (no stored token)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          scope: '@dioschub'
          cache: npm
      # Trusted Publishing (OIDC) needs npm >= 11.5.1; node 20 ships 10.x. Pin to
      # npm@11 (latest is 12.x, which requires node >= 22).
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Skip the publish if this exact version is already on npm, so a push to
      # production without a version bump does not fail on "cannot republish".
      - name: Is this version already published?
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "already $NAME@$VERSION is on npm — skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      # No NODE_AUTH_TOKEN: npm >= 11.5.1 exchanges the GitHub OIDC token for a
      # short-lived publish credential via the package's Trusted Publisher config.
      # publishConfig.access=public keeps the scoped package public.
      - name: Publish to npm (Trusted Publishing / OIDC)
        if: steps.check.outputs.skip == 'false'
        run: npm publish
